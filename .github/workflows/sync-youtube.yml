name: Sincronizar YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-prod.txt

      - name: Sincronizar videos al feed
        run: python scripts/actualizar_feed_youtube.py

      - name: Sincronizar estadísticas
        run: python scripts/sync_youtube_stats.py

      - name: Invalidar caché de la API
        env:
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash scripts/invalidar_cache_api.sh
