name: Actualizar playlist semanal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_PLAYLIST_REFRESH_TOKEN: ${{ secrets.SPOTIFY_PLAYLIST_REFRESH_TOKEN }}
      SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
      FG_PAGE_ID: ${{ secrets.FG_PAGE_ID }}
      FG_PAGE_TOKEN: ${{ secrets.FG_PAGE_TOKEN }}
      PROMO_AUTO_PUBLISH: ${{ secrets.PROMO_AUTO_PUBLISH }}
      PROMO_IG: ${{ secrets.PROMO_IG }}
      API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
      WEB_URL: ${{ secrets.WEB_URL }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-prod.txt

      - name: Generar la playlist semanal
        run: python scripts/generar_playlist_semanal.py --output-json data/playlist_seleccion_semanal.json

      - name: Publicar anuncio en redes
        if: env.PROMO_AUTO_PUBLISH == 'true'
        run: python scripts/publicar_playlist_semanal.py
