name: Sincronizar publicaciones de Meta

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Publicaciones por artista en esta ejecución"
        required: true
        default: "50"
        type: choice
        options:
          - "50"
          - "10"
  schedule:
    - cron: "0 13 * * *"

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      META_SYNC_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limite || '10' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-prod.txt

      - name: Sincronizar publicaciones
        run: python scripts/sync_feed_igfb.py

      - name: Invalidar caché de la API
        env:
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash scripts/invalidar_cache_api.sh
